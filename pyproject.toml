[build-system]
requires = ["maturin>=1.8,<2.0"]
build-backend = "maturin"

[project]
name = "polars-umap"
description = "UMAP dimensionality reduction as a Polars plugin, powered by Apple's embedding-atlas Rust implementation"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Jeroen Janssens" }]
requires-python = ">=3.9"
dependencies = ["polars>=1.0.0"]
dynamic = ["version"]
keywords = ["polars", "umap", "dimensionality-reduction", "embeddings", "plugin", "manifold-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Visualization",
]

[project.urls]
Repository = "https://github.com/jeroenjanssens/polars-umap"
Upstream = "https://github.com/apple/embedding-atlas"

[dependency-groups]
test = [
    "pytest>=8",
    "pytest-xdist>=3",
    "hypothesis>=6",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "pyarrow>=14",
]
parity = ["umap-learn>=0.5"]
bench = [
    "pytest-benchmark>=4",
    "umap-learn>=0.5",
    "scikit-learn>=1.3",
    "numpy>=1.24",
    "matplotlib>=3.7",
]
lint = ["ruff>=0.8", "mypy>=1.10"]
docs = ["mkdocs-material>=9", "mkdocstrings[python]>=0.26"]
examples = ["matplotlib>=3.7", "numpy>=1.24", "scikit-learn>=1.3", "pyarrow>=14", "marimo>=0.9", "altair>=5"]
dev = [
    "maturin>=1.8,<2.0",
    { include-group = "test" },
    { include-group = "lint" },
]

[tool.uv]
default-groups = ["dev"]
# Rebuild the extension when Rust sources change.
cache-keys = [{ file = "pyproject.toml" }, { file = "Cargo.toml" }, { file = "src/**/*.rs" }]

[tool.maturin]
module-name = "polars_umap._internal"
python-source = "python"
features = ["pyo3/extension-module"]
include = [{ path = "LICENSE", format = "sdist" }, { path = "NOTICE", format = "sdist" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: long-running tests (deselect with '-m \"not slow\"')",
    "parity: comparisons against umap-learn (requires the 'parity' dependency group)",
    "gpu: tests that need a GPU adapter",
]

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "D"]
ignore = ["D105", "D107", "D203", "D213", "D413", "D417", "RUF022"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"benchmarks/**" = ["D", "E501", "RUF001"]
"examples/**" = ["D", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["polars_umap"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["python/polars_umap"]
