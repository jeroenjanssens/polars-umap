[package]
name = "polars-umap"
version = "0.1.0"
edition = "2021"
license = "MIT"
readme = "README.md"
description = "UMAP dimensionality reduction as a Polars plugin, powered by Apple's embedding-atlas Rust implementation"
repository = "https://github.com/jeroenjanssens/polars-umap"
authors = ["Jeroen Janssens"]
publish = false

[lib]
name = "_internal"
crate-type = ["cdylib", "rlib"]

[features]
default = ["gpu"]
# WebGPU (Metal / Vulkan / DX12) acceleration via wgpu. Falls back to CPU at runtime
# when no suitable adapter is found.
gpu = ["umap/gpu", "nndescent/gpu"]

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py39"] }
pyo3-polars = { version = "0.28", features = ["derive"] }
polars = { version = "0.55", default-features = false, features = ["dtype-array", "dtype-struct", "dtype-i8", "dtype-i16", "dtype-u8", "dtype-u16"] }
polars-arrow = { version = "0.55", default-features = false }
serde = { version = "1", features = ["derive"] }
ndarray = "0.17"
rayon = "1.11"
umap = { git = "https://github.com/apple/embedding-atlas", rev = "a0d0f0938db386a86dc855182df3432e1814891d" }
nndescent = { git = "https://github.com/apple/embedding-atlas", rev = "a0d0f0938db386a86dc855182df3432e1814891d" }

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3

[lints.clippy]
all = { level = "warn", priority = -1 }

# Fast-to-build optimized profile for local development:
#   uv run maturin develop --uv --profile dev-release
[profile.dev-release]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
