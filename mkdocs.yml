site_name: polars-umap
site_description: UMAP dimensionality reduction as a Polars plugin
repo_url: https://github.com/jeroenjanssens/polars-umap
theme:
  name: material
  features: [content.code.copy, navigation.sections]
  palette:
    - scheme: default
      toggle: { icon: material/brightness-7, name: Dark mode }
    - scheme: slate
      toggle: { icon: material/brightness-4, name: Light mode }
nav:
  - Home: index.md
  - Examples: examples.md
  - API reference: api.md
  - Benchmarks: benchmarks.md
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [python]
          options:
            docstring_style: numpy
            show_root_heading: true
            show_source: false
markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: [".", "examples"]
  - tables
hooks:
  - docs/hooks.py
