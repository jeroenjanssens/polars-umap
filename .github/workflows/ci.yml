name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: uvx ruff check .
      - run: uvx ruff format --check .
      - run: uvx --with polars --with numpy mypy

  rust-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --lib

  tests:
    name: tests (${{ matrix.os }}, py${{ matrix.python }}, polars ${{ matrix.polars }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.13"]
        polars: [latest]
        include:
          # Oldest supported combination
          - { os: ubuntu-latest, python: "3.9", polars: "1.0.0" }
          - { os: ubuntu-latest, python: "3.10", polars: "1.20.0" }
          - { os: ubuntu-latest, python: "3.12", polars: "1.39.0" }
          # Newest Python
          - { os: ubuntu-latest, python: "3.14", polars: latest }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Build wheel
        run: uvx maturin build --profile dev-release --out dist
      - name: Run tests
        shell: bash
        run: |
          POLARS_SPEC=$([ "${{ matrix.polars }}" = latest ] && echo polars || echo "polars==${{ matrix.polars }}")
          uv run --isolated --no-project -p ${{ matrix.python }} \
            --with dist/*.whl --with "$POLARS_SPEC" \
            --with pytest --with pytest-xdist --with hypothesis --with numpy --with scikit-learn \
            pytest -n auto -m "not parity and not gpu" tests

  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --group parity
      - run: uv run pytest -m "parity or slow" tests

  micro-benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --group bench
      - run: uv run pytest benchmarks/test_micro.py --benchmark-only --benchmark-json=benchmark.json
      - uses: actions/upload-artifact@v4
        with:
          name: micro-benchmarks
          path: benchmark.json
